<!doctype html>
<html lang="en" data-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dupe Cleaner Batch</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.2.1/flowbite.min.css" />
    <link rel="stylesheet" href="styles.css" />
    <script
      defer
      src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.2.1/flowbite.min.js"></script>
  </head>
  <body
    class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen">
    <div
      class="w-full max-w-3xl pt-2 px-6 pb-6 bg-gray-800 rounded-lg shadow-lg main-content">
      <div class="inline-flex items-center justify-center w-full">
        <hr class="w-64 h-px my-8 border-0 bg-gray-500" />
        <span
          class="absolute px-3 font-bold uppercase tracking-wide -translate-x-1/2 left-1/2 text-white bg-gray-800">
          Batch Dupe Cleaner
        </span>
      </div>

      <h2 class="text-lg font-semibold mb-2">Deck hashes</h2>

      <div
        class="w-full mb-4 border border-gray-200 rounded-lg bg-gray-50 dark:bg-gray-700 dark:border-gray-600">
        <div class="px-4 py-2 bg-white rounded-lg dark:bg-gray-800">
          <textarea
            id="partialInput"
            rows="6"
            spellcheck="false"
            class="w-full px-0 text-xs text-gray-900 bg-white border-0 dark:bg-gray-800 focus:ring-0 dark:text-gray-400 dark:placeholder-gray-400"
            placeholder="Enter deck hashes (one per line)..."></textarea>
        </div>
      </div>

      <h2 class="text-lg font-semibold mb-2">Candidates</h2>

      <div
        class="w-full mb-4 border border-gray-200 rounded-lg bg-gray-50 dark:bg-gray-700 dark:border-gray-600">
        <div class="px-4 py-2 bg-white rounded-t-lg dark:bg-gray-800">
          <textarea
            id="poolInput"
            rows="8"
            spellcheck="false"
            class="w-full px-0 text-xs text-gray-900 bg-white border-0 dark:bg-gray-800 focus:ring-0 dark:text-gray-400 dark:placeholder-gray-400"
            placeholder="Enter candidates hashes (one per line)..."></textarea>
        </div>
      </div>

      <h2 class="text-lg font-semibold mb-2">Results</h2>

      <div
        class="w-full mb-4 border border-gray-200 rounded-lg bg-gray-50 dark:bg-gray-700 dark:border-gray-600">
        <div class="px-4 py-2 bg-white rounded-t-lg dark:bg-gray-800">
          <textarea
            id="resultsInput"
            rows="8"
            readonly
            spellcheck="false"
            class="w-full px-0 text-xs text-gray-900 bg-white border-0 dark:bg-gray-800 focus:ring-0 dark:text-gray-400 dark:placeholder-gray-400"
            placeholder="Filtered results will appear here..."></textarea>
        </div>
      </div>

      <div class="flex flex-wrap items-center justify-between gap-2">
        <button
          type="button"
          id="clearButton"
          class="py-2.5 px-4 text-sm flex items-center justify-center bg-blue-900 text-white rounded-lg hover:bg-blue-800">
          Clear All Fields
        </button>

        <button
          type="button"
          id="copyCandidates"
          class="py-2.5 px-4 text-sm flex items-center justify-center bg-blue-900 text-white rounded-lg hover:bg-blue-800">
          Copy Results
        </button>

        <button
          type="button"
          id="runButton"
          class="inline-flex items-center py-2.5 px-4 text-xs font-medium text-center text-white bg-blue-700 rounded-lg hover:bg-blue-800">
          Remove dupes
        </button>
      </div>
    </div>

    <div class="text-center mt-3 text-sm text-gray-500">
      v 0.3 © Dess 2026.

      <a href="https://github.com/TheSench/SIMSpellstone" target="_blank">
        Based on SIMSpellstone </a
      >.
      <a href="./mit.html">MIT License</a>
    </div>

    <script src="dataInitializer.js"></script>
  </body>
</html>
